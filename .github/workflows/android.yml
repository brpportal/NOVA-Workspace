name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Generate Gradle wrapper if missing
      run: |
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
        fi
        chmod +x gradlew

    # app/build.gradle.kts signs debug builds with ${rootDir}/debug.keystore,
    # which is gitignored and not part of the AI Studio export. Restore the ONE
    # permanent keystore from secrets so every build carries the SAME signature
    # and updates install over the previous app. Fall back to generating a
    # throwaway keystore only when the secret is absent (e.g. forks).
    - name: Restore permanent debug keystore
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        if [ ! -f debug.keystore ]; then
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Permanent keystore restored from secrets."
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "WARNING: no keystore secret; generated a throwaway keystore."
          fi
        fi

    - name: Run Unit Tests
      run: ./gradlew :app:testDebugUnitTest --stacktrace

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: nova-workspace-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
